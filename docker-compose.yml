# Stack de Coolify para surfnativo.uy (frontend Next.js).
#
# Un solo servicio: el servidor de Next (`node server.js`, salida standalone).
# No hay base de datos ni workers: todos los datos vienen del backend Laravel
# vía NEXT_PUBLIC_API_URL. Nada está hardcodeado: cada valor sale de las
# Environment Variables de Coolify.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # Next hornea las NEXT_PUBLIC_* en el bundle durante `next build`
      # (lib/api.ts, lib/chat.ts, lib/seo.ts). Si cambian, hay que redeployar.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    image: surf-nativo:${COOLIFY_RESOURCE_UUID:-latest}
    pull_policy: build
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    # Puerto interno; Traefik lo publica con TLS en el dominio del servicio.
    expose:
      - "3000"
    healthcheck:
      # /robots.txt es estático y no depende del backend.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
